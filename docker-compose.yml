# The end-to-end suite, in the image it is meant to run in. `npm run test:e2e`
# is this; CI runs the same service. See tests/e2e/README.md.
services:
  e2e:
    build:
      context: .
      dockerfile: Dockerfile
    image: filter-bubble-e2e
    # Chromium outgrows the 64MB of shared memory a container gets by default
    # and crashes on pages that are perfectly ordinary; this is what Playwright's
    # own image documentation recommends instead of raising `shm_size`.
    ipc: host
    # `--load-extension` needs the extension on disk, and the browser has to
    # reach the fixture server, but nothing here reaches the network.
    network_mode: none
    # Forwarded, not set: a container gets none of the host's environment, so
    # without these the knobs the suite reads would silently stop working the
    # moment it moved in here. `CI` is the one that matters - it turns on the
    # retry and the GitHub reporter that playwright.config.mjs keys off it - and
    # it is set by the runner rather than by us, so only forwarding carries it.
    environment:
      CI: ${CI:-}
      PW_WORKERS: ${PW_WORKERS:-}
    volumes:
      # The working tree, so an edit to a spec or to the extension runs without
      # rebuilding the image.
      - .:/app
      # Masks the working tree's `node_modules` with the one the image
      # installed, so the suite runs against the locked dependency tree built
      # for this platform rather than whatever the host happens to have.
      - /app/node_modules
