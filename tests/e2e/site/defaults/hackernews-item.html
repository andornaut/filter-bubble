<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture in the shape of a Hacker News item page</title>
  </head>
  <body>
    <table id="hnmain">
      <tbody>
        <tr id="pagespace"></tr>
        <tr>
          <td>
            <table class="fatitem">
              <tbody>
                <tr class="athing submission" id="the-story">
                  <td class="title">
                    <span class="titleline">A story about politics</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>
        <tr>
          <td class="comment" id="a-comment">A comment mentioning politics</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
