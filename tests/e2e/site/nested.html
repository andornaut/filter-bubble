<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture feed with nested matches</title>
  </head>
  <body>
    <h1>Nested matches</h1>
    <main id="feed">
      <article id="outer">
        <h2>Wrapper</h2>
        <div class="thing" id="inner">
          <p>An item about politics, inside a container.</p>
        </div>
      </article>
      <article id="plain">
        <h2>Unrelated</h2>
        <p>Tomatoes, basil, and when to plant them.</p>
      </article>
    </main>
  </body>
</html>
