<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture feed with awkward text</title>
  </head>
  <body>
    <h1>Awkward text</h1>
    <main id="feed">
      <article id="s-cpp">
        <h2>Toolchains</h2>
        <p>Learning C++ this year, finally.</p>
      </article>
      <article id="s-dot">
        <h2>Shorthand</h2>
        <p>Try a.b for short.</p>
      </article>
      <article id="s-axb">
        <h2>Lookalike</h2>
        <p>The axb pattern comes up a lot.</p>
      </article>
      <article id="s-star">
        <h2>Wildcards</h2>
        <p>Everyone writes .* without thinking.</p>
      </article>
      <article id="s-upper">
        <h2>Shouting</h2>
        <p>POLITICS, in capitals.</p>
      </article>
      <article id="s-plain">
        <h2>Unrelated</h2>
        <p>Tomatoes, basil, and when to plant them.</p>
      </article>
    </main>
  </body>
</html>
