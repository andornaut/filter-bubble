name: Release

# Every branch, not just main and pull requests, for the reason the AI
# attributions workflow gives: work lands on main directly as often as it
# arrives through one, so a check that only runs on main is a check that runs
# after the fact. The release job below is guarded separately and still
# publishes from main and tags alone.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read is all `build` needs. Only `release` publishes, and it asks for write
# itself, so a change to the build job cannot reach the repository.
permissions:
  contents: read

# Key the group on the branch, not the ref, so that the push event and the pull
# request event for the same branch land in one group instead of two. Otherwise
# every pull request from a branch in this repository - which is every
# Dependabot one - builds and tests twice over, once per event. Keyed on the ref
# they read as different work; keyed on the branch the second to start
# supersedes the first, which is what `cancel-in-progress` is already relied on
# to do for two pushes in a row.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Publishing waits on the scan as well: a release is a durable artifact, and
  # taking an attribution back off after one is cut means rewriting history that
  # has already been published. Called only where a release can follow, since
  # the scan workflow already runs on every push and pull request of its own
  # accord.
  attributions:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/ai-attributions.yml

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check size
        run: npm run size

      # `npm run package` builds, lints that build, then zips it, so `build:prod`
      # runs here as well as inside `npm run size` above. The build itself is a
      # fraction of a second, so the repeat costs less than wiring the two steps
      # to share one output would; `web-ext lint` is what the time goes on.
      - name: Package extension
        run: npm run package

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-package
          path: web-ext-artifacts/filter_bubble-*.zip

  release:
    needs: [build, attributions]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # The one job that writes: it creates and deletes releases and tags.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: extension-package
          path: artifacts

      # `dev` is a moving target, so its asset carries no version: the URL a
      # consumer fetches stays the same across re-cuts, and each upload replaces
      # its predecessor instead of accumulating beside the one before it.
      - name: Name the dev asset without its version
        if: github.ref == 'refs/heads/main'
        run: mv artifacts/filter_bubble-*.zip artifacts/filter_bubble-dev.zip

      # A release follows its tag, and updating one below does not move the tag
      # GitHub already has, so `dev` has to be repointed here or the release's
      # commit link and source archives would describe an older build than the
      # assets beside them. Unmasked on purpose: a rejected tag push (tag
      # protection, or credentials the checkout did not persist) has to fail
      # the job rather than quietly publish binaries with the wrong commit.
      - name: Move the dev tag to this commit
        if: github.ref == 'refs/heads/main'
        run: |
          git tag --force dev
          git push --force origin refs/tags/dev

      # Updated in place rather than deleted and recreated. Deleting first left
      # `dev` a 404 for the length of the upload, and permanently if the run
      # died in between; every asset name here is deterministic, so each upload
      # replaces its predecessor and nothing from the previous cut survives.
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'dev' || github.ref_name }}
          name: ${{ github.ref == 'refs/heads/main' && 'dev' || github.ref_name }}
          body: ${{ github.ref == 'refs/heads/main' && 'Latest build from main branch' || '' }}
          make_latest: ${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}
          files: artifacts/filter_bubble-*.zip
