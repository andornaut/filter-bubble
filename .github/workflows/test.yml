name: Test

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Called by the release workflow, so that nothing is published that this has
  # not passed. Workflows do not wait on each other, so a green Test run beside
  # a release says nothing about whether the release waited for it.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Keyed by the calling workflow as well, so the run started by a push and the
# run the release workflow calls do not cancel each other.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Capped well under the six-hour default: nothing here runs longer than
    # six minutes, so a job still going at fifteen has hung rather than failed.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-docker-action@v5.7.0
        with:
          version: v29.9.3

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! ${GITHUB_SHA:-} =~ ^[a-f0-9]{40}$ ]]; then
            printf '%s\n' 'CI requires a full expected commit SHA.' >&2
            exit 2
          fi
          expected_revision=$(git --no-optional-locks -c core.fsmonitor=false -c core.hooksPath=/dev/null rev-parse --verify "${GITHUB_SHA}^{commit}")
          if [[ $(git rev-parse HEAD) != "${expected_revision}" || -n $(git --no-optional-locks -c core.fsmonitor=false -c core.hooksPath=/dev/null status --porcelain=v1 --untracked-files=all) ]]; then
            printf '%s\n' 'CI requires the expected commit and a clean checkout.' >&2
            exit 2
          fi
          git ls-files --error-unmatch .nvmrc package.json package-lock.json tests/container/stock >/dev/null
          ci_control_blob=$(git --no-optional-locks -c core.fsmonitor=false -c core.hooksPath=/dev/null rev-parse --verify "${expected_revision}:tests/container/stock")
          ci_control_entry=$(git --no-optional-locks -c core.fsmonitor=false -c core.hooksPath=/dev/null ls-tree "${expected_revision}" -- tests/container/stock)
          if [[ ( ${ci_control_entry} != "100644 blob ${ci_control_blob}"$'\t'"tests/container/stock" && ${ci_control_entry} != "100755 blob ${ci_control_blob}"$'\t'"tests/container/stock" ) || ! -f tests/container/stock || -L tests/container/stock || ( ${ci_control_entry} == 100644* && -x tests/container/stock ) || ( ${ci_control_entry} == 100755* && ! -x tests/container/stock ) || $(git hash-object --no-filters -- tests/container/stock) != "${ci_control_blob}" ]]; then
            printf '%s\n' 'CI stock control source differs from the expected regular blob.' >&2
            exit 2
          fi
          source tests/container/stock
          stock_begin "$PWD"
          if [[ ${revision} != "${expected_revision}" || ${source_dirty} != false ]]; then
            printf '%s\n' 'CI source changed before snapshot capture.' >&2
            exit 2
          fi
          stock_image node_image "node:$(sed 's/^v//' .nvmrc)"
          stock_prepare "${node_image}" node -- sh -ec '
            node --version >&2
            npm --version >&2
            mkdir -p /scratch/node
            cp package.json package-lock.json /scratch/node/
            npm ci --prefix /scratch/node --maxsockets=1 --ignore-scripts --no-audit --no-fund >&2
            tar --create --file - --directory / scratch/node/node_modules
          '
          stock_run "${node_image}" node -- sh -ec '
            cp -R /scratch/node/node_modules node_modules
            export PATH="/work/node_modules/.bin:${PATH}"
            export HUSKY=0
            npm run test -- --runInBand
          '
          stock_finish

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-docker-action@v5.7.0
        with:
          version: v29.9.3

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! ${GITHUB_SHA:-} =~ ^[a-f0-9]{40}$ ]]; then
            printf '%s\n' 'CI requires a full expected commit SHA.' >&2
            exit 2
          fi
          expected_revision=$(git --no-optional-locks -c core.fsmonitor=false -c core.hooksPath=/dev/null rev-parse --verify "${GITHUB_SHA}^{commit}")
          if [[ $(git rev-parse HEAD) != "${expected_revision}" || -n $(git --no-optional-locks -c core.fsmonitor=false -c core.hooksPath=/dev/null status --porcelain=v1 --untracked-files=all) ]]; then
            printf '%s\n' 'CI requires the expected commit and a clean checkout.' >&2
            exit 2
          fi
          git ls-files --error-unmatch .nvmrc package.json package-lock.json tests/container/stock >/dev/null
          ci_control_blob=$(git --no-optional-locks -c core.fsmonitor=false -c core.hooksPath=/dev/null rev-parse --verify "${expected_revision}:tests/container/stock")
          ci_control_entry=$(git --no-optional-locks -c core.fsmonitor=false -c core.hooksPath=/dev/null ls-tree "${expected_revision}" -- tests/container/stock)
          if [[ ( ${ci_control_entry} != "100644 blob ${ci_control_blob}"$'\t'"tests/container/stock" && ${ci_control_entry} != "100755 blob ${ci_control_blob}"$'\t'"tests/container/stock" ) || ! -f tests/container/stock || -L tests/container/stock || ( ${ci_control_entry} == 100644* && -x tests/container/stock ) || ( ${ci_control_entry} == 100755* && ! -x tests/container/stock ) || $(git hash-object --no-filters -- tests/container/stock) != "${ci_control_blob}" ]]; then
            printf '%s\n' 'CI stock control source differs from the expected regular blob.' >&2
            exit 2
          fi
          source tests/container/stock
          stock_begin "$PWD"
          if [[ ${revision} != "${expected_revision}" || ${source_dirty} != false ]]; then
            printf '%s\n' 'CI source changed before snapshot capture.' >&2
            exit 2
          fi
          stock_image node_image "node:$(sed 's/^v//' .nvmrc)"
          stock_prepare "${node_image}" node -- sh -ec '
            node --version >&2
            npm --version >&2
            mkdir -p /scratch/node
            cp package.json package-lock.json /scratch/node/
            npm ci --prefix /scratch/node --maxsockets=1 --ignore-scripts --no-audit --no-fund >&2
            tar --create --file - --directory / scratch/node/node_modules
          '
          stock_run "${node_image}" node -- sh -ec '
            cp -R /scratch/node/node_modules node_modules
            export PATH="/work/node_modules/.bin:${PATH}"
            export HUSKY=0
            for script in tests/container/stock tests/container/check-stock; do bash -n "$script"; done
            for script in tests/container/node tests/container/markdown; do sh -n "$script"; done
            npx --no-install prettier --check .
            npx --no-install eslint --max-warnings 0 .
          '
          stock_image markdown_image node:24.22.2
          stock_prepare "${markdown_image}" markdown -- sh -ec '
            mkdir -p /scratch/markdown
            cp tests/container/package.json tests/container/package-lock.json /scratch/markdown/
            npm ci --prefix /scratch/markdown --ignore-scripts --no-audit --no-fund --maxsockets=1 >&2
            tar --create --file - --directory / scratch/markdown
          '
          stock_run "${markdown_image}" markdown -- /scratch/markdown/node_modules/.bin/markdownlint-cli2
          stock_image shellcheck_image koalaman/shellcheck:v0.11.0
          stock_readonly "${shellcheck_image}" /bin/shellcheck -x -P SCRIPTDIR \
            tests/container/stock \
            tests/container/check-stock tests/container/node tests/container/markdown
          stock_finish
